[package]
name = "qubit-cpp-infra-coverage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Validated LLVM source coverage and quality gates for C++ projects"
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/cpp-infra-coverage"
include = ["src/**", "build.rs", "conf/**", "assets/**", "schemas/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.zh_CN.md", "rust-toolchain.toml"]

[[bin]]
name = "cpp-infra-coverage"
path = "src/main.rs"

[dependencies]
clap = { version = "^4.5", features = ["derive"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
toml = "^0.9"
sha2 = "^0.11"
thiserror = "^2.0"
walkdir = "^2.5"
fs2 = "^0.4"
chrono = "^0.4"
ctrlc = "^3.0"
libc = "^0.2"
num-bigint = "^0.4"
roxmltree = "^0.21"

[dev-dependencies]
tempfile = "^3.27"
